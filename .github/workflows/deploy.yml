name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          if [ -z "$TINA_PUBLIC_CLIENT_ID" ] || [ "$TINA_PUBLIC_CLIENT_ID" = "local" ]; then
            echo "TINA_PUBLIC_CLIENT_ID is missing. Add it as a *repository* Action secret (not an environment secret), then re-run this workflow."
            exit 1
          fi
          if [ -z "$TINA_TOKEN" ] || [ "$TINA_TOKEN" = "local" ]; then
            echo "TINA_TOKEN is missing. Add it as a *repository* Action secret (not an environment secret), then re-run this workflow."
            exit 1
          fi
          npm run build
        env:
          GITHUB_PAGES: 'true'
          TINA_PUBLIC_CLIENT_ID: ${{ secrets.TINA_PUBLIC_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
